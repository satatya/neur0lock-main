# NeuroLock log server (accounting store).
# Accepts syslog over TLS only, and only from clients presenting a certificate signed by the
# NeuroLock CA whose name is "aaa" (the AAA server) - see PermittedPeer.

global(
  workDirectory="/var/spool/rsyslog"
  defaultNetstreamDriver="gtls"
  defaultNetstreamDriverCAFile="/certs/ca.crt"
  defaultNetstreamDriverCertFile="/certs/rsyslog.crt"
  defaultNetstreamDriverKeyFile="/certs/rsyslog.key"
  maxMessageSize="64k"
)

module(
  load="imtcp"
  streamDriver.name="gtls"
  streamDriver.mode="1"
  streamDriver.authMode="x509/name"
  permittedPeer=["aaa"]
)
input(type="imtcp" port="6514")

# One line per event: receive time, sending host, message id (action) and the JSON event
template(name="NeuroLockAudit" type="string" string="%timegenerated:::date-rfc3339% %fromhost% %app-name% %msgid% %msg%\n")

if $app-name == "neurolock-aaa" then {
  action(type="omfile" file="/var/log/neurolock/audit.log" template="NeuroLockAudit" dirCreateMode="0750" fileCreateMode="0640")
  stop
}

*.* action(type="omfile" file="/var/log/neurolock/other.log")

# NeuroLock - barebones secure AAA setup
#
#   Website (nginx, HTTPS 443) --> REST API (Express) --> MySQL 3306 (clinical records)
#                                       |
#                                       +-- HTTPS 443, mutual TLS --> AAA server (Python/Flask)
#                                                                        |-- OpenLDAP 389 + StartTLS (users, roles, permissions)
#                                                                        +-- rsyslog 6514 TLS (accounting log)
#
#   cp .env.example .env      # then fill in the secrets
#   docker compose up -d --build
#
# Networks mirror the diagram: the website only reaches the API, the API reaches MySQL and the
# AAA server, and only the AAA server reaches the directory and the log server.

name: neurolock

services:
  certgen:
    build: ./infra/certs
    volumes:
      - certs:/certs
    restart: "no"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: neurolock
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - ./backend/sql-dbms-bundle/sql-dbms/db/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./backend/sql-dbms-bundle/sql-dbms/db/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"   # local tools only
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  openldap:
    image: osixia/openldap:1.5.0
    hostname: openldap
    environment:
      LDAP_ORGANISATION: NeuroLock
      LDAP_DOMAIN: neurolock.local
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?set LDAP_ADMIN_PASSWORD in .env}
      LDAP_CONFIG_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: openldap.crt
      LDAP_TLS_KEY_FILENAME: openldap.key
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
      LDAP_TLS_ENFORCE: "true"          # every bind must use StartTLS
      LDAP_TLS_VERIFY_CLIENT: never
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    command: --copy-service
    volumes:
      - certs:/container/service/slapd/assets/certs:ro
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    ulimits:
      nofile: 1024
    networks: [security]
    healthcheck:
      test: ["CMD-SHELL", "LDAPTLS_CACERT=/container/service/slapd/assets/certs/ca.crt ldapwhoami -x -ZZ -H ldap://localhost -D cn=admin,dc=neurolock,dc=local -w \"$$LDAP_ADMIN_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      certgen:
        condition: service_completed_successfully
    restart: unless-stopped

  rsyslog:
    build: ./infra/rsyslog
    volumes:
      - certs:/certs:ro
      - audit-logs:/var/log/neurolock
    networks: [security]
    depends_on:
      certgen:
        condition: service_completed_successfully
    restart: unless-stopped

  aaa:
    build: ./aaa-server
    environment:
      LDAP_URL: ldap://openldap:389
      LDAP_START_TLS: "true"
      LDAP_BASE_DN: dc=neurolock,dc=local
      LDAP_BIND_DN: cn=admin,dc=neurolock,dc=local
      LDAP_BIND_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      AAA_SECRET_KEY: ${AAA_SECRET_KEY:?set AAA_SECRET_KEY in .env}
      SYSLOG_HOST: rsyslog
      SYSLOG_PORT: "6514"
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@1234}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
    volumes:
      - certs:/certs:ro
      - aaa-data:/data
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0   # non-root gunicorn binds 443
    networks: [backend, security]
    depends_on:
      openldap:
        condition: service_healthy
      rsyslog:
        condition: service_started
    restart: unless-stopped

  api:
    build: ./neurolock-staff-backend
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: neurolock
      KEK_HEX: ${KEK_HEX:?set KEK_HEX in .env}
      AAA_URL: https://aaa:443
      AAA_CA_FILE: /certs/ca.crt
      AAA_CLIENT_CERT: /certs/api.crt
      AAA_CLIENT_KEY: /certs/api.key
      TRUST_PROXY: "true"
      TRUST_PROXY_HOSTS: web   # only nginx may set X-Forwarded-For; direct callers on 4311 are their socket address
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@1234}   # used by the synthetic-data tool
    volumes:
      - certs:/certs:ro
    ports:
      - "4311:4311"   # the mobile app (Expo) talks to the API directly on the LAN
    networks: [web, backend, data]
    depends_on:
      mysql:
        condition: service_healthy
      aaa:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    volumes:
      - certs:/certs:ro
    ports:
      - "443:443"
      - "80:80"
    networks: [web]
    depends_on:
      - api
    restart: unless-stopped

networks:
  web: {}
  backend: {}
  data: {}
  security: {}

volumes:
  certs: {}
  mysql-data: {}
  ldap-data: {}
  ldap-config: {}
  aaa-data: {}
  audit-logs: {}
